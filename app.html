<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpareKey</title>
<style>
  :root { --bg:#f3f4f6; --card:#fff; --ink:#23262b; --muted:#7d838c; --red:#c0453e; --green:#3d8a4f; --amber:#c98a1e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:ui-sans-serif,system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:20px 24px 8px; }
  h1 { margin:0; font-size:1.5rem; }
  .sub { color:var(--muted); margin:4px 0 0; font-size:.9rem; }
  main { max-width:720px; margin:0 auto; padding:12px 16px 40px; }
  form { background:var(--card); border-radius:12px; padding:14px; display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  input, select, button { font:inherit; padding:8px 10px; border:1px solid #d8dce1; border-radius:8px; background:#fff; }
  input[type=text] { flex:1; min-width:120px; }
  button { background:#23262b; color:#fff; border:none; cursor:pointer; }
  button.ghost { background:#e9ebee; color:var(--ink); }
  .stat { display:flex; gap:16px; margin-bottom:14px; flex-wrap:wrap; }
  .stat .s { background:var(--card); border-radius:10px; padding:10px 16px; box-shadow:0 1px 4px rgba(0,0,0,.05); }
  .s b { font-size:1.3rem; display:block; }
  .s span { font-size:.78rem; color:var(--muted); }
  .card { background:var(--card); border-radius:12px; padding:12px 16px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,.06); display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .what { font-weight:600; }
  .kind { font-size:.72rem; font-weight:700; color:var(--muted); border:1px solid #d8dce1; border-radius:999px; padding:1px 8px; margin-left:6px; text-transform:uppercase; }
  .holder { color:var(--muted); font-size:.88rem; margin-top:2px; }
  .age { font-weight:700; font-size:.9rem; }
  .age.old { color:var(--red); }
  .age.mid { color:var(--amber); }
  .returned-tag { color:var(--green); font-size:.82rem; font-weight:600; }
  .actions { display:flex; gap:6px; }
  .actions button { padding:6px 12px; font-size:.85rem; }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }
  h2 { font-size:.85rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:18px 0 8px; }
</style>
</head>
<body>
<header>
  <h1>SpareKey</h1>
  <p class="sub">Who can get into your place right now? Track every key copy, door code and remote you've handed out - and whether it came back.</p>
</header>
<main>
  <div class="stat" id="stat"></div>
  <form id="add-form">
    <input type="text" id="f-what" placeholder="What (e.g. Front door key copy)" required maxlength="60">
    <input type="text" id="f-holder" placeholder="Who has it" required maxlength="40">
    <select id="f-kind"></select>
    <input type="date" id="f-given" required>
    <button type="submit">Log it</button>
  </form>
  <div id="out-list"></div>
  <div id="ret-list"></div>
</main>
<script src="engine.js"></script>
<script>
(function () {
  var KEY = 'sparekey-v1';
  function today() { return new Date().toISOString().slice(0, 10); }
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
  function save() { localStorage.setItem(KEY, JSON.stringify(entries)); }
  var entries = load();

  var kindSel = document.getElementById('f-kind');
  SpareKey.KINDS.forEach(function (k) {
    var o = document.createElement('option'); o.value = k; o.textContent = k;
    kindSel.appendChild(o);
  });
  document.getElementById('f-given').value = today();

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function ageClass(d) { return d > 180 ? 'age old' : d > 30 ? 'age mid' : 'age'; }
  function fmtAge(d) {
    if (d === 0) return 'today';
    if (d < 30) return d + 'd out';
    var m = Math.round(d / 30.4);
    if (m < 24) return m + 'mo out';
    return (d / 365.25).toFixed(1) + 'y out';
  }

  function entryCard(e, isOut, days) {
    var card = el('div', 'card');
    var left = el('div');
    var w = el('span', 'what', e.what);
    var k = el('span', 'kind', e.kind);
    var wl = el('div'); wl.appendChild(w); wl.appendChild(k);
    left.appendChild(wl);
    left.appendChild(el('div', 'holder', e.holder + ' - since ' + e.givenOn));
    card.appendChild(left);
    var right = el('div', 'actions');
    if (isOut) {
      right.appendChild(el('span', ageClass(days), fmtAge(days)));
      var ret = el('button', 'ghost', 'Got it back');
      ret.onclick = function () { SpareKey.markReturned(entries, e.id, today()); save(); render(); };
      right.appendChild(ret);
    } else {
      right.appendChild(el('span', 'returned-tag', 'back ' + e.returnedOn));
    }
    var del = el('button', 'ghost', 'x');
    del.title = 'Delete entry';
    del.onclick = function () {
      if (!confirm('Delete "' + e.what + '"?')) return;
      SpareKey.removeEntry(entries, e.id); save(); render();
    };
    right.appendChild(del);
    card.appendChild(right);
    return card;
  }

  function render() {
    var s = SpareKey.summary(entries, today());
    var stat = document.getElementById('stat');
    stat.innerHTML = '';
    [['Still out', s.out], ['Returned', s.returned], ['Longest out', s.oldestOut === null ? '-' : fmtAge(s.oldestOut)]].forEach(function (t) {
      var d = el('div', 's');
      d.appendChild(el('b', null, String(t[1])));
      d.appendChild(el('span', null, t[0]));
      stat.appendChild(d);
    });
    var outWrap = document.getElementById('out-list');
    var retWrap = document.getElementById('ret-list');
    outWrap.innerHTML = ''; retWrap.innerHTML = '';
    var out = SpareKey.outstanding(entries, today());
    if (out.length) {
      outWrap.appendChild(el('h2', null, 'Still out there'));
      out.forEach(function (o) { outWrap.appendChild(entryCard(o.entry, true, o.daysOut)); });
    }
    var ret = entries.filter(function (e) { return e.returnedOn; });
    if (ret.length) {
      retWrap.appendChild(el('h2', null, 'Returned'));
      ret.forEach(function (e) { retWrap.appendChild(entryCard(e, false)); });
    }
    if (!entries.length) outWrap.innerHTML = '<div class="empty">Nothing logged. Add the keys and codes you have handed out over the years.</div>';
  }

  document.getElementById('add-form').onsubmit = function (e) {
    e.preventDefault();
    try {
      SpareKey.addEntry(entries,
        document.getElementById('f-what').value,
        document.getElementById('f-holder').value,
        document.getElementById('f-given').value,
        kindSel.value);
    } catch (err) { alert(err.message); return; }
    document.getElementById('f-what').value = '';
    document.getElementById('f-holder').value = '';
    save(); render();
  };
  render();
})();
</script>
</body>
</html>
